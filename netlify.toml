[build]
  publish = "."
  command = "node tools/build.mjs"

# Scripture is genuinely immutable — the KJV text of John 1 will not change,
# so these can be cached hard and forever.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker decides which version of the app everyone runs. If a
# stale copy is cached, users are pinned to an old build with no way out,
# so it must always be revalidated.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
